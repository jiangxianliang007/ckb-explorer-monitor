global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Uncomment and configure alertmanager_configs to enable Alertmanager.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

scrape_configs:
  - job_name: ckb-explorer-mainnet
    static_configs:
      - targets: ['mainnet:9333']

  - job_name: ckb-explorer-testnet
    static_configs:
      - targets: ['testnet:9334']
